name: CI and Cloudflare Pages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Upload Pages assets
        uses: actions/upload-artifact@v4
        with:
          name: pages-assets
          path: dist
          if-no-files-found: error
          retention-days: 1

  deploy:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download Pages assets
        uses: actions/download-artifact@v4
        with:
          name: pages-assets
          path: dist

      - name: Verify Cloudflare deployment secrets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" || -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::Add CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN as GitHub Actions repository secrets."
            exit 1
          fi

      - name: Ensure Cloudflare Pages project exists
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          page=1
          project_exists=false

          while true; do
            projects="$(curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects?page=$page&per_page=100")"

            if ! jq -e '.success == true and (.result | type == "array")' <<< "$projects" >/dev/null; then
              echo "::error::Could not list Cloudflare Pages projects."
              jq -r '.errors[]?.message // empty' <<< "$projects" >&2
              exit 1
            fi

            if jq -e --arg name "hetzner-manager" 'any(.result[]; .name == $name)' <<< "$projects" >/dev/null; then
              project_exists=true
              break
            fi

            total_pages="$(jq -r '.result_info.total_pages // 1' <<< "$projects")"
            if (( page >= total_pages )); then
              break
            fi
            page=$((page + 1))
          done

          if [[ "$project_exists" == true ]]; then
            echo "Cloudflare Pages project hetzner-manager already exists."
            exit 0
          fi

          created_response="$(curl --silent --show-error \
            --write-out '\n%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{"name":"hetzner-manager","production_branch":"main"}' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects")"
          status="${created_response##*$'\n'}"
          created="${created_response%$'\n'*}"

          if (( status < 200 || status >= 300 )) || ! jq -e '.success == true and .result.name == "hetzner-manager"' <<< "$created" >/dev/null; then
            echo "::error::Could not create Cloudflare Pages project hetzner-manager."
            jq -r '.errors[]?.message // empty' <<< "$created" >&2
            exit 1
          fi

          echo "Created Cloudflare Pages project hetzner-manager."

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=hetzner-manager --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
